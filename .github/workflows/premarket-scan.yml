# Runs the scanner before the open and posts the watchlist to the run's summary page,
# so you can review it from your phone. Trading itself runs on your machine (see README).
# Needs repo secrets ALPACA_API_KEY and ALPACA_SECRET_KEY (paper keys).
name: premarket scan

on:
  schedule:
    - cron: "45 12 * * 1-5"   # 08:45 ET in summer (EDT), 07:45 ET in winter (EST)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m patterntrader scan
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - run: cat watchlists/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: watchlist
          path: watchlists/
