[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patterntrader"
version = "0.1.0"
description = "Disciplined, regime-aware pattern day-trading bot for Alpaca (paper trading only)."
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.30",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
patterntrader = "patterntrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
